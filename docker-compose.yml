# Release Tracker, fully local: `docker compose up -d --build`
#
#   db       PostgreSQL 17
#   migrate  applies server/db/migrations once (and the demo data on first run), then exits
#   app      Express API + the web app on http://localhost:8800
#
# Everything is published on 127.0.0.1 only. The defaults below are for local
# use; to change them put POSTGRES_PASSWORD / APP_DB_PASSWORD / ENCRYPTION_KEY
# in a .env file next to this one *before the first start*.

name: release-tracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-release-tracker-local-owner-password}
      POSTGRES_DB: release_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Optional direct access (psql, TablePlus…). Localhost only.
      - 127.0.0.1:${DB_PORT:-54329}:5432
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, release_tracker]
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    image: release-tracker-app
    command: [node, dist-server/server/db/migrate.js]
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_OWNER_URL: postgres://postgres:${POSTGRES_PASSWORD:-release-tracker-local-owner-password}@db:5432/release_tracker
      DATABASE_URL: postgres://release_tracker_app:${APP_DB_PASSWORD:-release-tracker-local-app-password}@db:5432/release_tracker
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-release-tracker-local-app-password}
      SEED: ${SEED:-true}

  app:
    build: .
    image: release-tracker-app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      # Restricted login: row level security always applies.
      DATABASE_URL: postgres://release_tracker_app:${APP_DB_PASSWORD:-release-tracker-local-app-password}@db:5432/release_tracker
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-release-tracker-local-encryption-key-change-me}
    ports:
      - 127.0.0.1:${APP_PORT:-8800}:3000

volumes:
  pgdata:
