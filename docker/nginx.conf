# One origin for everything: the app, plus the Supabase APIs under the same
# paths the hosted platform uses, so supabase-js works unchanged.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx's default mime.types lacks the web app manifest (needed for install).
  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Security headers (the CSP itself is a <meta> tag in index.html).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  client_max_body_size 5m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Realtime picks its tenant from the first label of the Host header.
    proxy_set_header Host realtime-dev.local;
    proxy_read_timeout 3600s;
  }

  # Hashed build output: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Must revalidate so rebuilt images are picked up.
  location ~ ^/(sw\.js|manifest\.webmanifest|theme-init\.js|index\.html)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  # SPA: unknown paths render the app.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
